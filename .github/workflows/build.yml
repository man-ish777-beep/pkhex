name: Build PKHeX 22.09.13
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore Packages
        run: nuget restore PKHeX.sln

      - name: Build Solution
        run: msbuild PKHeX.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-22.09.13
          path: '**/bin/Release/*.exe'