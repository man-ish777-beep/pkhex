name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: dir
        shell: cmd

      - name: Unzip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter *.zip | Select-Object -First 1
          Write-Host "Found zip: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath p -Force

      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $s = (Get-ChildItem p -Recurse -Filter PKHeX.sln).FullName
          Write-Host "Found sln: $s"
          nuget restore $s
          msbuild $s /p:Configuration=Release /m

      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Win7
          path: p/**/PKHeX.exe

    