name: Build 22.09.13
on: [push]
jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          powershell Expand-Archive -Path *.zip -DestinationPath . -Force
          dir

      - uses: NuGet/setup-nuget@v1
        with:
          nuget-version: 5.x

      - uses: microsoft/setup-msbuild@v1.3

      - name: Restore
        run: for /r %%f in (*.sln) do nuget restore "%%f"

      - name: Build
        run: for /r %%f in (*.sln) do msbuild "%%f" /p:Configuration=Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-22.09.13
          path: '**/PKHeX.exe'