

    name: build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: Expand-Archive *.zip -DestinationPath p -Force
        shell: pwsh
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - run: |
          $s = (Get-ChildItem p -Recurse -Filter PKHeX.sln).FullName
          nuget restore $s
          msbuild $s /p:Configuration=Release /m
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX
          path: p/**/PKHeX.exe